name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Verify clean install (simulates fresh user pip install)
        run: |
          python -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install . --quiet
          /tmp/clean_venv/bin/pip check

      - name: Install package (core + dev + plots)
        run: pip install -e ".[dev,plots]"

      - name: Install torch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check src/

      - name: Format check (black)
        continue-on-error: true
        run: black --check --fast src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short -x
        env:
          PYTHONPATH: src

      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/raman-data
          key: ${{ runner.os }}-raman-datasets-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-raman-datasets-

      - name: Verify benchmark datasets (smoke test)
        run: pytest tests/test_data_download_integration.py::test_benchmark_init_and_dataset_listing -v
        timeout-minutes: 5
        env:
          PYTHONPATH: src

  test-autogluon:
    # The batch runner, spectrum-cache and parallel-step tests import the AutoGluon-based
    # mixin and tabarena, so they skip in the jobs above. This job installs both and runs them.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with AutoGluon and tabarena
        run: |
          pip install -e ".[dev,plots,autogluon]"
          pip install -r requirements-tabarena-git.txt

      - name: Install torch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Fail if the AutoGluon stack does not import
        run: python -c "import autogluon.common, tabarena"

      - name: Run AutoGluon-dependent tests (fails if any test skips)
        run: |
          pytest tests/test_spectrum_cache.py tests/test_parallel_preprocessing.py tests/test_run_experiment_batch.py -v -rs --tb=short | tee pytest-autogluon.log
          if grep -q " skipped" pytest-autogluon.log; then echo "tests were skipped"; exit 1; fi
        env:
          PYTHONPATH: src

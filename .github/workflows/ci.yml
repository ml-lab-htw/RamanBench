name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install package (core + dev)
        run: pip install -e ".[dev]"

      - name: Install torch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        run: ruff check src/

      - name: Format check (black)
        run: black --check --fast src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short -x
        env:
          PYTHONPATH: src

      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/raman-data
          key: ${{ runner.os }}-raman-datasets-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-raman-datasets-

      - name: Verify benchmark datasets (smoke test)
        run: pytest tests/test_data_download_integration.py::test_benchmark_init_and_dataset_listing -v
        timeout-minutes: 5
        env:
          PYTHONPATH: src

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Check dist
        run: |
          pip install twine
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

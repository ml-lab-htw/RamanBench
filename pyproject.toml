[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raman-bench"
version = "2.0.1"
description = "A large-scale benchmark for machine learning on Raman spectroscopy data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Mario Koddenbrock", email = "mario.koddenbrock@htw-berlin.de" },
    { name = "Christoph Lange", email = "christoph.lange@tu-berlin.de" },
]
maintainers = [
    { name = "Mario Koddenbrock", email = "mario.koddenbrock@htw-berlin.de" },
]
keywords = [
    "raman", "spectroscopy", "benchmark", "machine-learning", "deep-learning",
    "autogluon", "tabular", "chemistry", "biology", "material-science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=1.4,<3.0",
    "scikit-learn>=1.0,<2.0",
    "matplotlib>=3.5,<4.0",
    "seaborn>=0.12",
    "tqdm>=4.64,<5.0",
    "raman-data>=1.6.2",
    "torch>=2.0,<3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
autogluon = [
    # Plain upstream AutoGluon (no fork). RamanBench previously depended on a
    # patched fork (see git history around the AutoGluon 1.6 dependency bump) that
    # relaxed the max_features/max_rows/max_classes caps AutoGluon puts on the
    # tabular foundation models (Mitra, TabDPT, TabICL, TabPFN v2) -- Raman spectra
    # routinely run 500-4000 wavenumber points, above those caps. That relief now
    # lives in RamanBench's own `preprocessing/wrapped_models.py` (`Prep_MITRA`,
    # `Prep_TABDPT`, `Prep_TABICL`, `Prep_REALTABPFN_V2`, `Prep_REALTABPFN_V25`),
    # using AutoGluon's own supported per-subclass `_default_auxiliary_params_extra`
    # override -- no fork required. >=1.6.1 floor: that's the version this override
    # and the rest of RamanBench's AutoGluon integration is verified against
    # (1.6.1 is also where TabICL's own v1->v2 + regression-support gap, the fork's
    # other original reason to exist, is resolved natively upstream).
    #
    # >=1.6.3b20260917,!=1.6.3 (prerelease range, deliberately excluding only
    # the exact stable 1.6.3 cut): required by TabArena's mandatory warm-up framework
    # (tabarena.benchmark.experiment.experiment_runner, require_warmup=True by
    # default as of the 2026-09-18 pin bump) -- it imports
    # autogluon.core.models.abstract._shared_weights_registry, which does not
    # exist in stable 1.6.2 (confirmed: every real experiment run raised
    # RuntimeError "Warm-up ... did not succeed ... ModuleNotFoundError:
    # _shared_weights_registry" until this bump).
    #
    # UPDATE 2026-09-19: the plain ">=1.6.3b20260917" floor (no ceiling) was a
    # REAL production failure confirmed live on the BHT cluster -- every single
    # task, across every model, failed at the post-evaluation step
    # (tabarena's get_metadata_fit -> _shared_weights_metadata, called
    # unconditionally for every fit) with the exact same
    # "ModuleNotFoundError: No module named
    # 'autogluon.core.models.abstract._shared_weights_registry'" this floor
    # was supposed to prevent. Root cause: AutoGluon cut a real stable 1.6.3
    # release AFTER this floor was set, and stable releases sort higher than
    # any of their own prereleases (PEP 440) -- so `>=1.6.3b20260917` started
    # resolving to stable 1.6.3 instead of staying on the prerelease chain,
    # and stable 1.6.3 does NOT contain _shared_weights_registry (confirmed by
    # downloading and inspecting its wheel directly: the module is present in
    # 1.6.3b20260917 through at least 1.6.3b20260918, absent in final 1.6.3).
    # The exclusion is deliberately `!=1.6.3`, NOT `<1.6.3`: PEP 440's
    # exclusive ordered comparison (`<V`) has a special rule that a `<V`
    # bound where V itself is not a pre-release ALSO excludes every
    # pre-release OF V (confirmed via `packaging.specifiers` directly: `<1.6.3`
    # rejects `1.6.3b20260917` too, the opposite of what's needed here) --
    # `!=1.6.3` excludes only the exact broken final release and correctly
    # keeps matching its prereleases. Revisit once a stable release genuinely
    # has the warm-up framework's module -- verify before ever removing this
    # exclusion or raising the floor past it.
    "autogluon.common>=1.6.3b20260917,!=1.6.3",
    "autogluon.core>=1.6.3b20260917,!=1.6.3",
    "autogluon.features>=1.6.3b20260917,!=1.6.3",
    "autogluon.tabular>=1.6.3b20260917,!=1.6.3",
    # Wavelet-threshold denoising (RamanPreprocessingMixin's wavelet_denoise step)
    # is imported defensively inside that function, but the tunable preprocessing
    # pipeline itself only ships as part of the `autogluon` extra, so pin it here.
    "PyWavelets>=1.4",
]
benchmark = [
    "bencheval>=0.1.0",
    # `tabarena` itself is NOT declared here. PyPI forbids direct-URL
    # requirements in an uploaded package, and this dependency is pinned to a
    # specific upstream commit rather than a PyPI release (see
    # requirements-tabarena-git.txt for the full rationale and the exact SHA).
    # The v2.0.0 release attempt failed the PyPI upload with exactly this
    # error ("Can't have direct dependency: tabarena @ git+...") -- confirmed
    # this extra is unusable without the separate install step below.
    #
    # Install after `pip install raman-bench[benchmark]`:
    #     pip install -r requirements-tabarena-git.txt
]
tracking = [
    # Optional per-task experiment tracking (scripts/run_experiment.py) --
    # only activates when WANDB_API_KEY is set in the environment (see
    # run_experiment.py's _wandb_enabled), so installing this extra without
    # setting the key is a no-op, not a behavior change. Kept as its own
    # extra (not folded into `benchmark`/`models`) so a cluster profile that
    # doesn't want the dependency at all can skip it.
    "wandb>=0.19",
    # Provisions per-model Workspaces + a cross-model Report (scripts/setup_wandb_views.py).
    "wandb-workspaces>=0.1.5",
]
models = [
    "raman-bench[autogluon]",
    "raman-bench[benchmark]",
    # tabarena's own per-model extras covering the gap found here: tabicl, ebm
    # (+configspace), realmlp (pytabkit), tabdpt, tabm (+torch). Deliberately NOT
    # tabarena's full `[benchmark]` union -- that also pulls `[tabpfn]`
    # (tabpfn>=8.0.8) which RamanBench's own floor below (now >=9.0.0) already
    # exceeds.
    #
    # tabpfnwide/TABPFN-WIDE REMOVED 2026-09-18: every published tabpfnwide
    # release (0.1.0 -> tabpfn==6.0.6, 0.2.0/0.3.0 -> tabpfn==8.0.3) exact-pins
    # an old tabpfn, permanently incompatible with tabpfn>=9.0.0 -- confirmed
    # via a real pip resolve (ResolutionImpossible against ALL 3 tabpfnwide
    # releases, not just the latest). That floor bump is required for
    # TabPFN-3.5 (tabarena.models.tabpfn_3_5, onboarded this same commit bump),
    # which needs it for its new multitask checkpoint format. Explicit call: drop tabpfnwide/
    # TABPFN-WIDE from the roster rather than block TabPFN-3.5 on it --
    # TABPFN-WIDE's already-computed results stay as historical data, just no
    # new runs. Revisit if tabpfnwide ever republishes against a newer tabpfn.
    #
    # `tabarena` itself (with its `[tabicl,ebm,search_spaces,realmlp,tabdpt,
    # tabm,perpetualboosting,chimeraboost]` extras) is NOT declared here for
    # the same PyPI direct-URL reason as `benchmark`'s entry -- see
    # requirements-tabarena-git.txt, which installs the extras-qualified form
    # and satisfies both this extra's and `benchmark`'s tabarena requirement
    # in one shot.
    # perpetualboosting/chimeraboost (batch 2 of the TabArena-native onboarding) pull
    # in their own third-party package below TabArena's own `pip_extra` metadata
    # (perpetual, chimeraboost>=0.14.1 respectively -- see
    # tabarena.models.{perpetual_booster,chimeraboost}.info) -- not hard AutoGluon/
    # tabarena dependencies, only needed once PERPETUAL_BOOSTER/CHIMERABOOST are
    # actually fit. Deliberately NOT tabarena's own `xrfm` extra here (its
    # `pip_extra` is `xrfm[cu12]`) -- confirmed via a real pip resolve on a
    # CUDA-less machine (macOS): `xrfm[cu12]` pulls `kermac[cu12]`, whose `cu12`
    # extra depends on `cuda-core`, which has no distribution at all for non-Linux/
    # non-CUDA platforms (ResolutionImpossible). Plain `xrfm` (below, no extra) is
    # the package's own documented CPU-safe "General Installation" path -- the
    # `cu12`/`cu11` extras are opt-in GPU-kernel acceleration only, and XRFM already
    # runs fine without them (falls back to `device="cpu"`, see generate/xrfm.py).
    "xrfm",
    "ramanspy>=0.2.10,<0.3.0",
    "imodels>=2.0.4",
    # >=9.0.0: required for TabPFN-3.5's multitask checkpoint format (tabarena.
    # models.tabpfn_3_5) -- see the tabpfnwide-removal comment above for why
    # this floor and tabpfnwide can no longer coexist.
    "tabpfn>=9.0.0",
    # >=0.4.3: floor bumped alongside tabpfn above -- 0.3.0 (the old floor) pins
    # "tabpfn<8,>=6.0.5", a hard ResolutionImpossible against tabpfn>=9.0.0
    # (confirmed via a real pip resolve). 0.4.3 is the first tabpfn-extensions
    # release requiring tabpfn>=8.1.0 (no ceiling), compatible with our floor.
    "tabpfn-extensions>=0.4.3",
    # <80: tabpfn_extensions/__init__.py eagerly imports its hpo submodule
    # (`from .hpo import TunedTabPFNClassifier, ...`), which pulls in hyperopt,
    # which still does `import pkg_resources` -- a module setuptools has since
    # removed entirely (confirmed real: `import tabpfn_extensions.many_class`
    # raises ModuleNotFoundError: No module named 'pkg_resources' with
    # setuptools 84.0.0 installed, and succeeds once setuptools<80 is pinned).
    # This isn't a rarely-hit corner: tabpfn_extensions.many_class.
    # ManyClassClassifier is AutoGluon core's OWN mechanism for handling
    # >10-class datasets on MITRA and every REALTABPFN-V2/V2.5/V2.6 model (see
    # autogluon.tabular.models.{mitra.mitra_model, tabpfnv2.tabpfnv2_5_model});
    # without this pin, that native many-class support silently hard-crashes
    # (ImportError re-raised, not a clean skip) the moment any of those models
    # hits a many-class dataset.
    "setuptools<80",
    "sktime>=0.40.0",
    "numba>=0.63.0",
    # ModernNCA (Prep_MODERNNCA) -- tabarena.models.modernnca._internal.data imports this
    # unconditionally at module level, so it's a hard runtime dependency of any ModernNCA
    # fit, not an optional/rarely-hit one (matches tabarena's own modernnca_info.pip_extra).
    "category_encoders",
    # Batch 3 (NORI, SAP_RPT_OSS, ORIONMSP, ILTM, LIMIX, TABSTAR) -- the final batch
    # of the TabArena-native onboarding effort. Every PyPI pin below matches tabarena's
    # own pip_extra metadata (tabarena.models.<key>.info) exactly, same rationale as
    # perpetualboosting/chimeraboost/xrfm above: these estimators stay the same
    # ones tabarena's own search spaces were tuned against.
    #
    # NOTE: iLTM's own floor (`numpy>=2.3.3`) forces a NumPy 1.x -> 2.x bump in this
    # environment -- confirmed compatible with the rest of the `models` stack via a
    # real local `pytest tests/` run after installing it (numpy resolved to 2.3.5,
    # satisfying both iLTM's floor and sktime's own `numpy<2.4,>=1.21` ceiling
    # simultaneously; the full suite passed, no other model regressed).
    # synthefy-nori/NORI REMOVED 2026-09-18: every published synthefy-nori release
    # (0.7.0 through 0.11.1, confirmed by iterating all of them via a real pip
    # resolve) pins "torch<2.9,>=2.8" -- unconditionally incompatible with
    # causilo's "torch>=2.13" floor (added when Causilo was onboarded), since
    # these two ranges never overlap regardless of which exact torch version
    # is chosen. This was a latent, unconditional ResolutionImpossible sitting
    # in this extras group since Causilo was merged -- surfaced by a real dry-run
    # while chasing an unrelated REALMLP/torchvision production failure. Same
    # resolution as the tabpfnwide removal above: drop the model rather than
    # block the whole `models` extra on it. NORI has no computed results yet
    # (confirmed: not among the currently-running k8s jobs), so this costs
    # nothing already in flight. Revisit if synthefy-nori ever republishes
    # against a newer torch, or if causilo's own floor ever loosens.
    "iltm>=0.1.1",
    "einops",
    "kditransform",
    "tabstar==1.1.15",
    # Causilo (Prep_CAUSILO) -- pretrained tabular foundation model from Nums AI
    # (github.com/nums-ai/causilo), added as a RamanBench-only custom model (no
    # TabArena integration exists as of tabarena 0.1.0 -- confirmed by inspecting
    # every tabarena.models.<key> directory in the installed wheel). Real PyPI
    # package, sklearn-compatible (CausiloClassifier/CausiloRegressor), requires
    # Python 3.10-3.12. Code is Apache-2.0; the pretrained checkpoint (downloaded
    # from Hugging Face on first fit) ships under a separate non-commercial
    # "Causilo License v1.0" -- fine for RamanBench's own research use, but noted
    # here for anyone vendoring this extras group into a commercial product.
    #
    # NOTE: causilo's own floor is unpinned torch>=2.13, which is *newer* than
    # the torch<2.10 ceiling `fastai` (Prep_FASTAI, also in this `models` group)
    # declares -- a real, confirmed pip resolver conflict (`pip install causilo`
    # into this env bumped torch 2.9.1 -> 2.14.0 and printed
    # "fastai 2.8.5 requires torch<2.10,>=1.10, but you have torch 2.14.0",
    # same shape as the tabpfn/tabpfnwide conflict noted above). Unlike that one,
    # this isn't resolved by pinning a floor here: fastai's ceiling is simply
    # stale. Verified fastai still imports and its TabularModel still builds
    # fine under torch 2.14 (only a torch.jit.script deprecation FutureWarning,
    # no actual breakage), so this is left as an unpinned, known-benign warning
    # rather than force-downgrading torch for every other GPU model in this
    # extras group.
    "causilo>=1.0.0",
    # fastai (Prep_FASTAI) -- referenced by name in the causilo/torch-ceiling note
    # just above, but never actually declared as its own dependency anywhere in
    # this extras group, a real gap: confirmed live on the k8s cluster, every
    # FASTAI task failed with "ModuleNotFoundError: No module named 'fastai'"
    # (autogluon.tabular's own try_import_fastai has no hard dependency on the
    # package -- AutoGluon only imports it lazily inside NeuralNetFastAiModel._fit,
    # so a missing `fastai` install is silent until the first real fit). No version
    # pin needed beyond what's already noted above (torch<2.10 ceiling, confirmed
    # benign under torch 2.14).
    "fastai",
    # torchvision was NOT previously declared anywhere in this dependency tree
    # -- it only arrived transitively (torchmetrics -> torchvision, pulled in
    # by pytorch_lightning -> pytabkit -> AutoGluon's RealMLP integration,
    # none of which actually use torchvision's own ops). Without an explicit
    # pin, pip resolved it independently of the torch bump above and left it
    # on a stale 0.24.1 (built against an older torch) once torch got bumped
    # to 2.14.0 -- confirmed causing a REAL production failure: every single
    # REALMLP task on the k8s cluster failed with "AttributeError: partially initialized
    # module 'torchvision' has no attribute 'extension' (circular import)",
    # torchvision's own C-extension registration breaking against a torch
    # version it wasn't built for. torchvision's own PyPI metadata pins its
    # required torch version exactly (0.29.0 requires torch==2.14.0) -- this
    # floor forces pip to resolve a genuinely matched pair instead of letting
    # torchvision drift independently of whatever torch ends up selected.
    "torchvision>=0.29.0",
    # NOTE: three TabArena-native models -- TabFM (Prep_TABFM), SAP-RPT-OSS
    # (Prep_SAP_RPT_OSS) and OrionMSP (Prep_ORIONMSP, from the `tabtune` package) --
    # are NOT installable from here. Their upstream packages publish no PyPI release,
    # only git repos, and PyPI forbids direct-URL (`@ git+https://...`) requirements
    # in an uploaded package. Install them by hand from `requirements-models-git.txt`
    # (`pip install -r requirements-models-git.txt`); the corresponding Prep_* classes
    # degrade to a clear "not available" error until you do (see
    # preprocessing/wrapped_models.py's optional-import guard).
    #
    # `tabarena` itself is the same story -- install it from
    # `requirements-tabarena-git.txt` (`pip install -r
    # requirements-tabarena-git.txt`) after this extra; every model that
    # depends directly on it (all `Prep_*` wrapping a `tabarena.models.*`
    # class) is unavailable until you do.
]
full = [
    "raman-bench[autogluon]",
    "raman-bench[benchmark]",
    "raman-bench[models]",
    "adjustText>=1.2.0",
    "pynvml>=11.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "sphinx-autodoc-typehints>=1.25",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage        = "https://github.com/ml-lab-htw/RamanBench"
Repository      = "https://github.com/ml-lab-htw/RamanBench"
"Bug Tracker"   = "https://github.com/ml-lab-htw/RamanBench/issues"
Leaderboard     = "https://huggingface.co/spaces/HTW-KI-Werkstatt/RamanBench"
"raman-data"    = "https://github.com/ml-lab-htw/raman_data"
Paper           = "https://arxiv.org/abs/2605.02003"

[project.scripts]
raman-bench = "raman_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
raman_bench = ["data/precomputed/*.csv", "data/precomputed/*.json"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["raman_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",   # line too long — handled by black
    "N803",   # argument name should be lowercase — X, y are standard ML conventions
    "N806",   # variable in function should be lowercase — X_train, X_test etc.
    "N812",   # lowercase imported as non-lowercase — torch.nn.functional as F is universal
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raman-bench"
version = "1.5.0"
description = "A large-scale benchmark for machine learning on Raman spectroscopy data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Mario Koddenbrock", email = "mario.koddenbrock@htw-berlin.de" },
    { name = "Christoph Lange", email = "christoph.lange@tu-berlin.de" },
]
maintainers = [
    { name = "Mario Koddenbrock", email = "mario.koddenbrock@htw-berlin.de" },
]
keywords = [
    "raman", "spectroscopy", "benchmark", "machine-learning", "deep-learning",
    "autogluon", "tabular", "chemistry", "biology", "material-science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=1.4,<3.0",
    "scikit-learn>=1.0,<2.0",
    "matplotlib>=3.5,<4.0",
    "seaborn>=0.12",
    "tqdm>=4.64,<5.0",
    # >=1.6.6: earlier releases register two synthetic_organic_pigments datasets as regression (raman_data#44).
    "raman-data>=1.6.6",
    "torch>=2.0,<3.0",
    "python-dotenv>=1.0",
    # Reads the bundled v1 reference results.
    "pyarrow>=12",
]

[project.optional-dependencies]
autogluon = [
    # Prerelease floor that excludes only stable 1.6.3. TabArena's warm-up imports
    # autogluon.core.models.abstract._shared_weights_registry, which exists in 1.6.3b2026091x but not in
    # stable 1.6.2 or 1.6.3. `!=1.6.3` (not `<1.6.3`) so the 1.6.3 prereleases still match.
    "autogluon.common>=1.6.3b20260917,!=1.6.3",
    "autogluon.core>=1.6.3b20260917,!=1.6.3",
    "autogluon.features>=1.6.3b20260917,!=1.6.3",
    "autogluon.tabular>=1.6.3b20260917,!=1.6.3",
    # For the wavelet_denoise step of the preprocessing pipeline.
    "PyWavelets>=1.4",
]
benchmark = [
    "bencheval>=0.1.0",
    # TabArena's grouped inner-fold splitter (issue #162) imports this.
    "data-foundry>=0.0.5",
    # `tabarena` is not declared here: PyPI forbids direct-URL requirements. After installing this extra, run
    # `pip install -r requirements-tabarena-git.txt`.
]
models = [
    "raman-bench[autogluon]",
    "raman-bench[benchmark]",
    # >=2.2.0: 2.1.0 hits the host-RAM OOM of perpetual-ml/perpetual#91 (RamanBench #41).
    "perpetual>=2.2.0",
    # Plain xrfm, not tabarena's xrfm[cu12] extra: that has no distribution on non-CUDA platforms.
    "xrfm",
    "ramanspy>=0.2.10,<0.3.0",
    "imodels>=2.0.4",
    "aplr>=10.26.0",
    "ctboost==0.1.61",
    # >=9.0.0 is needed for TabPFN-3.5's multitask checkpoint format.
    "tabpfn>=9.0.0",
    # 0.4.0 is the first release that is compatible with tabpfn>=9.0.0.
    "tabpfnwide>=0.4.0",
    # >=0.4.3: earlier releases pin tabpfn<8.
    "tabpfn-extensions>=0.4.3",
    # tabpfn_extensions imports hyperopt, which needs pkg_resources (gone from newer setuptools).
    # AutoGluon's many-class support for MITRA and the TabPFN models depends on that import.
    "setuptools<80",
    "sktime>=0.40.0",
    "numba>=0.63.0",
    # HIVE-COTE 2 and its components. aeon caps numba<0.64.
    "aeon>=1.6.0,<1.7",
    # Hard dependency of ModernNCA.
    "category_encoders",
    # iLTM needs numpy>=2.3.3.
    "iltm>=0.1.1",
    "einops",
    "kditransform",
    # Needs torch>=2.13, above the torch<2.10 that fastai declares. fastai still works (warning only).
    # The pretrained weights are under the non-commercial Causilo License v1.0.
    "causilo>=1.0.0",
    # AutoGluon imports fastai lazily, so a missing install only fails at the first fit.
    "fastai",
    # Keeps torch and torchvision a matched pair (a stale torchvision broke REALMLP). 0.28 pairs with
    # torch 2.13; synthefy-nori caps torch<2.14.
    "torchvision>=0.28.0",
    # Not installable from here: TabFM, SAP-RPT-OSS and OrionMSP (tabtune) publish no PyPI release
    # (`pip install -r requirements-models-git.txt`), and neither does tabarena
    # (`pip install -r requirements-tabarena-git.txt`).
]
plots = [
    # autorank: critical difference diagrams. plotly: the interactive figures.
    "autorank>=1.2",
    "bencheval>=0.1.0",
    "plotly>=5.0",
]
full = [
    "raman-bench[autogluon]",
    "raman-bench[plots]",
    "raman-bench[benchmark]",
    "raman-bench[models]",
    "adjustText>=1.2.0",
    "pynvml>=11.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "sphinx-autodoc-typehints>=1.25",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage        = "https://github.com/ml-lab-htw/RamanBench"
Repository      = "https://github.com/ml-lab-htw/RamanBench"
"Bug Tracker"   = "https://github.com/ml-lab-htw/RamanBench/issues"
Leaderboard     = "https://huggingface.co/spaces/HTW-KI-Werkstatt/RamanBench"
"raman-data"    = "https://github.com/ml-lab-htw/raman_data"
Paper           = "https://arxiv.org/abs/2605.02003"

[project.scripts]
raman-bench = "raman_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
raman_bench = [
    "data/precomputed/*.csv",
    "data/precomputed/*.json",
    "data/precomputed/v1/*.parquet",
    "data/precomputed/v1/*.json",
    "plotting/data/*.csv",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["raman_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",   # line too long — handled by black
    "N803",   # argument name should be lowercase — X, y are standard ML conventions
    "N806",   # variable in function should be lowercase — X_train, X_test etc.
    "N812",   # lowercase imported as non-lowercase — torch.nn.functional as F is universal
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

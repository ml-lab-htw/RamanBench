[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raman-bench"
version = "0.1.1"
description = "A large-scale benchmark for machine learning on Raman spectroscopy data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Mario Koddenbrock", email = "mario.koddenbrock@htw-berlin.de" },
    { name = "Christoph Lange", email = "christoph.lange@tu-berlin.de" },
]
maintainers = [
    { name = "Mario Koddenbrock", email = "mario.koddenbrock@htw-berlin.de" },
]
keywords = [
    "raman", "spectroscopy", "benchmark", "machine-learning", "deep-learning",
    "autogluon", "tabular", "chemistry", "biology", "material-science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=1.4,<3.0",
    "scikit-learn>=1.0,<2.0",
    "matplotlib>=3.5,<4.0",
    "seaborn>=0.12",
    "tqdm>=4.64,<5.0",
    "raman-data>=1.2.6",
    "torch>=2.0,<3.0",
]

[project.optional-dependencies]
autogluon = [
    "autogluon.common>=1.5",
    "autogluon.core>=1.5",
    "autogluon.features>=1.5",
    "autogluon.tabular>=1.5",
    "bencheval @ git+https://github.com/autogluon/tabarena.git#subdirectory=packages/bencheval",
    "tabarena @ git+https://github.com/autogluon/tabarena.git#subdirectory=packages/tabarena",
]
models = [
    "raman-bench[autogluon]",
    # tabarena's own per-model extras covering the gap found here: tabicl, ebm
    # (+configspace), realmlp (pytabkit), tabdpt, tabm (+torch). Deliberately NOT
    # tabarena's full `[benchmark]` union -- that also pulls `[tabpfn]`
    # (tabpfn>=8.0.8), which conflicts with `tabpfnwide` below: every published
    # tabpfnwide release exact-pins an *older* tabpfn (0.3.0 -> tabpfn==8.0.3),
    # incompatible with tabarena's floor (confirmed via a real pip resolve:
    # "tabpfnwide 0.1.0 depends on tabpfn==6.0.6" vs "tabarena[tabpfn] depends on
    # tabpfn>=8.0.8" -- ResolutionImpossible). RamanBench keeps its own, more
    # permissive tabpfn/tabpfn-extensions floor below instead, which tabpfnwide's
    # exact pin already satisfies.
    #
    # The extras MUST be attached directly to this git URL, not requested as a bare
    # "tabarena[...]" elsewhere -- a real (unrelated, version-0.0.0 placeholder)
    # package named "tabarena" exists on PyPI, so a bare name+extras requirement
    # resolves against *that* instead of this git dependency and conflicts with the
    # `autogluon` extra's URL-pinned "tabarena" below (confirmed via a real pip
    # resolve: ResolutionImpossible over exactly this).
    "tabarena[tabicl,ebm,search_spaces,realmlp,tabdpt,tabm] @ git+https://github.com/autogluon/tabarena.git#subdirectory=packages/tabarena",
    "ramanspy>=0.2.10,<0.3.0",
    "imodels>=2.0.4",
    "tabpfn>=6.3.2",
    "tabpfn-extensions>=0.3.0",
    "tabpfnwide>=0.1.0",
    "sktime>=0.40.0",
    "numba>=0.63.0",
]
full = [
    "raman-bench[autogluon]",
    "raman-bench[models]",
    "adjustText>=1.2.0",
    "pynvml>=11.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "sphinx-autodoc-typehints>=1.25",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage        = "https://github.com/ml-lab-htw/RamanBench"
Repository      = "https://github.com/ml-lab-htw/RamanBench"
"Bug Tracker"   = "https://github.com/ml-lab-htw/RamanBench/issues"
Leaderboard     = "https://huggingface.co/spaces/HTW-KI-Werkstatt/RamanBench"
"raman-data"    = "https://github.com/ml-lab-htw/raman_data"
Paper           = "https://arxiv.org/abs/2605.02003"

[project.scripts]
raman-bench = "raman_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
raman_bench = ["data/precomputed/*.csv", "data/precomputed/*.json"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["raman_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",   # line too long — handled by black
    "N803",   # argument name should be lowercase — X, y are standard ML conventions
    "N806",   # variable in function should be lowercase — X_train, X_test etc.
    "N812",   # lowercase imported as non-lowercase — torch.nn.functional as F is universal
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
